# Render Blueprint Infrastructure Specification (render.yaml)
# Project: AI Content Extraction Services (WML)

services:
  # 1. FastAPI REST API Service
  - type: web
    name: content-extraction-api
    env: docker
    dockerfilePath: infra/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "AI Content Extraction Service"
      - key: API_V1_STR
        value: "/v1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: content-extraction-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: content-extraction-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: VALID_API_KEYS
        value: '["wml_dev_key_2026","wml_live_8f3a912b"]'

  # 2. Celery Background Worker Service
  - type: worker
    name: content-extraction-worker
    env: docker
    dockerfilePath: infra/backend.Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: content-extraction-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: content-extraction-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: content-extraction-api
          envVarKey: GROQ_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: content-extraction-api
          envVarKey: OPENAI_API_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: content-extraction-api
          envVarKey: GEMINI_API_KEY
      - key: STORAGE_BACKEND
        value: local

  # 3. React Frontend Admin Dashboard (Static Site)
  - type: web
    name: content-extraction-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: content-extraction-api
          property: host

  # 4. Redis Cache / Message Broker
  - type: redis
    name: content-extraction-redis
    ipAllowList: [] # Allow internal connections only
    plan: free

# 5. Managed PostgreSQL Database
databases:
  - name: content-extraction-db
    databaseName: content_extraction
    user: content_user
    plan: free
